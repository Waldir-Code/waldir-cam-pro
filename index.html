<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Camara Pro · Captura profesional</title>
    <!-- Font Awesome (íconos) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>
    <div class="app-container">
        <!-- HEADER -->
        <header>
            <h1><i class="fas fa-camera-retro"></i> Camara Pro</h1>
            <span class="badge">v2.0 · Waly Camara Pro</span>
        </header>

        <!-- MAIN: DOS COLUMNAS -->
        <main class="two-columns">
            <!-- COLUMNA IZQUIERDA: CÁMARA + CONTROLES -->
            <section class="col-camera">
                <div class="camera-card">
                    <div class="video-wrapper">
                        <video id="video" autoplay playsinline></video>
                        
                        <canvas id="canvas" style="display:none;"></canvas>
                        <div class="crop-overlay" id="cropOverlay">
                            <div class="crop-box" id="cropBox">
                                <div id="circleOverlay" class="circle-overlay"></div>
                                <div id="linesOverlay" class="lines-overlay">
                                    <div class="line-vertical line-left"></div>
                                    <div class="line-vertical line-right"></div>
                                </div>
                                <!-- CRUZ PEQUEÑA CENTRADA -->
                                <div id="crosshair" class="crosshair">
                                    <div class="crosshair-line horizontal"></div>
                                    <div class="crosshair-line vertical"></div>
                                    <div class="crosshair-dot"></div> <!-- ← PUNTO CENTRAL -->
                                </div>
                            </div>
                        </div>
                    </div>
                    <!-- CONTROLES DE RECORTE (fuera del cuadro) -->
                    <div class="crop-controls-wrapper">
                        <span class="crop-label"><i class="fas fa-crop-alt"></i> Recorte</span>
                        <button id="cropShrinkBtn" class="crop-btn" title="Reducir"><i class="fas fa-minus"></i></button>
                        <button id="cropResetBtn" class="crop-btn" title="Restablecer"><i class="fas fa-undo-alt"></i></button>
                        <button id="cropExpandBtn" class="crop-btn" title="Expandir"><i class="fas fa-plus"></i></button>
                        <button id="toggleCircleBtn" class="crop-btn" title="Mostrar/ocultar círculo"><i class="fas fa-circle"></i></button>
                        <button id="toggleLinesBtn" class="crop-btn" title="Mostrar/ocultar líneas verticales"><i class="fas fa-vertical-line"></i></button>
                        <button id="toggleCrosshairBtn" class="crop-btn" title="Mostrar/ocultar cruz">
                            <i class="fas fa-crosshairs"></i>
                        </button>
                    </div>
                    <div class="controls">
                        <div class="camera-selector">
                            <label for="cameraSelect"><i class="fas fa-video"></i></label>
                            <select id="cameraSelect"></select>
                        </div>
                        <div class="action-buttons">
                            <button id="captureBtn" class="btn-primary">
                                <i class="fas fa-camera"></i> Capturar
                            </button>
                            <button id="clearBtn" class="btn-secondary">
                                <i class="fas fa-trash-alt"></i> Limpiar
                            </button>
                        </div>
                    </div>
                    <footer class="app-footer">
                        <span>© 2026 Waldir Delgado Bruna · Todos los derechos reservados</span>
                    </footer>
                </div>
            </section>

            <!-- COLUMNA DERECHA: GALERÍA -->
            <section class="col-gallery">
                <div class="gallery-card">
                    <div class="gallery-header">
                        <h3><i class="fas fa-images"></i> Fotos capturadas</h3>
                        <span id="countPhotos" class="count-badge">0</span>
                    </div>
                    <div id="gallery" class="gallery-grid"></div>
                </div>
            </section>
        </main>
    </div>
    <!-- MODAL DE CONFIRMACIÓN PERSONALIZADO -->
    <div id="confirmModal" class="modal-overlay" style="display:none;">
        <div class="modal-box">
            <div class="modal-icon">
                <i class="fas fa-trash-alt"></i>
            </div>
            <h3 id="confirmTitle">¿Eliminar todas las fotos?</h3>
            <p id="confirmMessage">Esta acción no se puede deshacer.</p>
            <div class="modal-actions">
                <button id="confirmCancelBtn" class="btn-modal btn-modal-secondary">Cancelar</button>
                <button id="confirmAcceptBtn" class="btn-modal btn-modal-danger">Eliminar</button>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
